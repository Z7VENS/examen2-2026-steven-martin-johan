name: CI

# Se ejecuta en cada push y en cada pull request
on:
  push:
  pull_request:

jobs:
  tests:
    name: Pruebas (php artisan test)
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Instalar PHP con las extensiones necesarias
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, sqlite, pdo_sqlite
          coverage: none

      # 3. Preparar el archivo de entorno
      - name: Copiar .env
        run: cp .env.example .env

      # 4. Instalar dependencias de Composer (cacheadas)
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      # 5. Generar la APP_KEY
      - name: Generar APP_KEY
        run: php artisan key:generate

      # 6. Levantar la base de datos de pruebas (SQLite)
      - name: Crear base de datos de pruebas
        run: |
          mkdir -p database
          touch database/database.sqlite

      # 7. Correr las migraciones contra la BD de pruebas
      - name: Ejecutar migraciones
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      # 8. Ejecutar la suite de pruebas
      - name: Ejecutar pruebas
        run: php artisan test
